services:
  app:
    build:
      context: .
      dockerfile: DockerFile
    container_name: citizen-feedback-api
    restart: unless-stopped
    working_dir: /var/www
    environment:
      APP_ENV: local
      APP_URL: http://127.0.0.1:8000
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: citizen_feedback
      DB_USERNAME: laravel
      DB_PASSWORD: cfs_0147
    ports:
      - "8000:8000"
    volumes:
      - ./citizen-feedback-api:/var/www
      - vendor_data:/var/www/vendor
      - storage_framework:/var/www/storage/framework
      - bootstrap_cache:/var/www/bootstrap/cache
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "mkdir -p storage/framework/cache storage/framework/sessions storage/framework/views storage/framework/testing bootstrap/cache &&
      rm -f bootstrap/cache/*.php &&
      cp .env .env.docker &&
      sed -i 's/^DB_HOST=.*/DB_HOST=db/' .env.docker &&
      sed -i 's/^DB_PORT=.*/DB_PORT=3306/' .env.docker &&
      sed -i 's#^APP_URL=.*#APP_URL=http://127.0.0.1:8000#' .env.docker &&
      php artisan optimize:clear --env=docker &&
      php artisan serve --env=docker --no-reload --host=0.0.0.0 --port=8000"

  db:
    image: mysql:8.0
    container_name: citizen-feedback-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: citizen_feedback
      MYSQL_USER: laravel
      MYSQL_PASSWORD: cfs_0147
      MYSQL_ROOT_PASSWORD: cfs_0147
    ports:
      - "3307:3306"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pcfs_0147"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  dbdata:
  vendor_data:
  storage_framework:
  bootstrap_cache:
