name: staff_mobile_app
description: "Engineering office staff and super admin app."

publish_to: 'none' 


version: 1.0.0+1

environment:
  sdk: ^3.10.8


dependencies:
  flutter:
    sdk: flutter

  http: ^1.2.1
  shared_preferences: ^2.2.3
  google_sign_in: ^6.3.0
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1
  image_picker: ^1.1.2
  url_launcher: ^6.3.1

  firebase_core: ^3.15.2
  firebase_auth: ^5.6.3
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.6



flutter:
  assets:
    - assets/images/engineering_office_bg.png
    - assets/images/logo.png
    - assets/images/logo_splash.png
    - assets/images/google_logo.svg

  
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo_splash.png"
  adaptive_icon_background: "#5D6673"
  adaptive_icon_foreground: "assets/images/logo_splash.png"

flutter_native_splash:
  color: "#0C1727"
  android: true
  ios: true
  web: false
  fullscreen: true
  android_12:
    color: "#0C1727"


